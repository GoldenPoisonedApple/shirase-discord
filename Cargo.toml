# プロジェクトのライブラリ管理
[package]
name = "shirase"
version = "0.1.0"
edition = "2024"
description = "Async notification library for Discord and other platforms"
license = "MIT"
readme = "README.md"
rust-version = "1.99" # 対応する最低バージョン

# ライブラリ
[lib]
name = "shirase"
path = "src/lib.rs"

[dependencies]
# 非同期
async-trait = "0.1.92"
# エラー
thiserror = "2.0.21"
# URL
url = "2.5.8"
# file
bytes = "1.12.1"
infer = "0.22.0"
# JSON
serde_json = "1.0.154"
# 時間
time = "0.3.55"
# http client
reqwest = { version = "0.13.5", features = ["json", "multipart"] }


# 開発環境のみでの依存
[dev-dependencies]

# 特定機能の依存
[features]
default = ["discord"]
discord = []
